name: 지수·환율 시세 갱신

on:
  schedule:
    - cron: '17 22 * * *'   # 매일 05:17 (베트남 시간)
  push:
    branches: [main]
    paths: ['tools/fetch_market.py', '.github/workflows/market.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yahoo 월봉 받기
        run: python3 tools/fetch_market.py
      - name: 바뀌었으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/market.json
          git diff --cached --quiet || git commit -m "시세 갱신 $(date -u +%F)"
          git push
